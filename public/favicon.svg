<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- Stylized "A" with wrench leg -->
  <g fill="#ffffff" transform="translate(32,33)">
    <!-- Left leg of A -->
    <polygon points="-4,-17 -15,17 -9,17 0,-5" />
    <!-- Right leg of A as wrench shape -->
    <polygon points="4,-17 15,17 9,17 0,-5" />
    <!-- Crossbar -->
    <rect x="-8" y="4" width="16" height="3.5" rx="1.5" />
    <!-- Small gear at center-bottom of A -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3.5 2" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
</svg>